<script>
  // Apply saved display settings before first paint so the theme never flashes.
  try {
    var s = JSON.parse(localStorage.getItem('lx-settings') || '{}'), r = document.documentElement;
    if (s.theme) r.dataset.theme = s.theme;
    if (s.contrast) r.dataset.contrast = 'high';
    if (s.font && s.font !== 'inter') r.dataset.font = s.font;
    if (s.motion) r.dataset.motion = 'reduce';
    if (s.textScale) r.style.setProperty('--lx-text-scale', s.textScale);
  } catch (e) {}
</script>
